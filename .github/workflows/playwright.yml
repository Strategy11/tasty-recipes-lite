name: E2E Test

on:
  pull_request:
    types: [labeled, synchronize]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: contains(github.event.pull_request.labels.*.name, 'run tests')

    name: Playwright Tests (${{ matrix.shard }}/${{ matrix.total }})

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        total: [2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH for GitHub
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Composer install
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GH_TOKEN }}"}}'
        run: composer install --no-interaction --prefer-dist

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node with caching
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build assets
        run: pnpm run build

      - name: Playwright run
        run: pnpm exec playwright test --config playwright.config.js --shard=${{ matrix.shard }}/${{ matrix.total }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}-${{ matrix.total }}
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results-${{ matrix.shard }}-${{ matrix.total }}
          path: test-results/
          retention-days: 7
