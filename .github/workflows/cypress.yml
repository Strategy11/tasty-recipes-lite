name: E2E Test

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, labeled, synchronize]

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'run tests')

    name: Cypress Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH for GitHub
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Composer install
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GH_TOKEN }}"}}'
        run: composer install --no-interaction --prefer-dist

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node with caching
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: cypress-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build assets
        run: pnpm run build

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          start: pnpm run env start
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 300
          browser: chrome
          command: pnpm run e2e:run
          install: false  # Already installed via pnpm
