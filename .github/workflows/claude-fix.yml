name: Claude Auto-Fix Issues

on:
  repository_dispatch:
    types: [claude-fix]

jobs:
  precheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      branch_exists: ${{ steps.check.outputs.branch_exists }}
      branch_name: ${{ steps.check.outputs.branch_name }}
      existing_pr_url: ${{ steps.check.outputs.existing_pr_url }}
    steps:
      - name: Check for existing claude-fix branch
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
        run: |
          BRANCH_NAME="claude-fix/issue-${ISSUE_NUMBER}"
          BRANCH_REF=$(gh api "repos/${{ github.repository }}/git/matching-refs/heads/${BRANCH_NAME}" --jq '.[0].ref // ""' 2>/dev/null || true)
          EXISTING_PR_URL=""

          if [ -n "$BRANCH_REF" ]; then
            EXISTING_PR_URL=$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH_NAME" --json url --jq '.[0].url // ""')
            echo "branch_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch_exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "existing_pr_url=$EXISTING_PR_URL" >> "$GITHUB_OUTPUT"

  notify-existing-branch:
    needs: precheck
    if: needs.precheck.outputs.branch_exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notify requester about existing branch
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
          ISSUES_REPO: ${{ github.event.client_payload.issues_repo }}
          REQUESTED_BY: ${{ github.event.client_payload.sender }}
          BRANCH_NAME: ${{ needs.precheck.outputs.branch_name }}
          EXISTING_PR_URL: ${{ needs.precheck.outputs.existing_pr_url }}
        run: |
          if [ -n "$EXISTING_PR_URL" ]; then
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$ISSUES_REPO" \
              --body "A Claude fix branch already exists for this issue in the Lite repository (\`$BRANCH_NAME\`), so this run was skipped to avoid duplicate work.

          Existing PR: $EXISTING_PR_URL

          @$REQUESTED_BY please continue review/testing on the existing PR."
          else
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$ISSUES_REPO" \
              --body "A Claude fix branch already exists for this issue in the Lite repository (\`$BRANCH_NAME\`), so this run was skipped to avoid duplicate work.

          @$REQUESTED_BY please review that branch or remove it before requesting another automated fix."
          fi

  fix:
    needs: precheck
    if: needs.precheck.outputs.branch_exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GH_TOKEN }}"}}'
        run: composer install --no-interaction --prefer-dist

      - name: Fix the issue
        id: claude_fix
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          branch: ${{ needs.precheck.outputs.branch_name }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.client_payload.issue_number }}
            ISSUE TITLE: ${{ github.event.client_payload.issue_title }}
            ISSUE BODY: ${{ github.event.client_payload.issue_body }}
            ISSUE AUTHOR: ${{ github.event.client_payload.issue_author }}
            ISSUES REPO: ${{ github.event.client_payload.issues_repo }}

            You are fixing a low-complexity bug in Tasty Recipes Lite, a WordPress plugin.
            The issue is tracked in a separate repository (${{ github.event.client_payload.issues_repo }})
            but the code lives here in ${{ github.repository }}.

            Steps:
            1. Read the issue carefully and understand what needs to change.
            2. Find the relevant code in the codebase.
            3. Implement the minimal, targeted fix. Do not refactor unrelated code.
            4. Follow WordPress coding standards. Use tabs for indentation.
            5. Every new or modified PHP function/method must have a doc comment with an @since x.x tag.
            6. If you modified PHP files, run: vendor/bin/phpcs --standard=phpcs.xml.dist <changed_files>
               Fix any violations before committing.
            7. Create a PR in this repository (${{ github.repository }}). In the PR description:
               - Include a "## Summary" section
               - Include a "## Test plan" section with concrete, step-by-step actions
                 written for support agents (non-developers). Include checkboxes.
               - Reference the issue: "Fixes ${{ github.event.client_payload.issues_repo }}#${{ github.event.client_payload.issue_number }}"

            Rules:
            - Do NOT modify files in vendor/, vendors/, node_modules/, languages/, or inc/libs/
            - Do NOT run build commands (npm run build, pnpm build, grunt, webpack)
            - Keep changes minimal and focused on the reported issue
            - Use null coalescing or ternary operators when accessing potentially undefined
              variables. Never stack ternaries or null coalescing operators.
            - Escape output with appropriate WordPress functions (esc_html, esc_attr, etc.)
            - Use the text domain "tasty-recipes-lite" for any translatable strings
            - Do not change existing behavior that is not part of the problem. Your fix
              should make the broken thing work correctly without altering how anything
              else works.
            - Do not refactor, reorganize, or "improve" surrounding code while you are
              there. Touch only what is necessary to solve the reported problem.
            - Aim for the smallest diff that fixes the issue. If your change is larger
              than you expected, you are probably doing too much.
          claude_args: |
            --allowedTools "Read,Write,Edit,Bash(git:*),Bash(gh pr create:*),Bash(vendor/bin/phpcs:*),Bash(vendor/bin/phpcbf:*),Bash(find:*),Bash(grep:*),Bash(cat:*),Bash(ls:*)"

      - name: Notify issue requester with PR
        if: steps.claude_fix.outputs.branch_name != ''
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
          BRANCH_NAME: ${{ steps.claude_fix.outputs.branch_name }}
          REQUESTED_BY: ${{ github.event.client_payload.sender }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
          ISSUES_REPO: ${{ github.event.client_payload.issues_repo }}
        run: |
          PR_URL=$(gh pr list --head "$BRANCH_NAME" --repo "${{ github.repository }}" --json url --jq '.[0].url')

          if [ -n "$PR_URL" ]; then
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$ISSUES_REPO" \
              --body "An automated Claude fix has been created for this issue in the Lite repository: $PR_URL

          @$REQUESTED_BY please review and test the changes."
          fi
