workflows:
  version: 2
  main:
    jobs:
      - lint
      - test-php
      - test-js

version: 2.1

orbs:
  browser-tools: circleci/browser-tools@1.4.8

jobs:
  lint:
    docker:
      - image: cimg/php:7.4-node
    steps:
      - checkout
      - run: sudo apt-get update
      - browser-tools/install-browser-tools:
          install-firefox: false
          chrome-version: latest
      - run: |
          php --version
          node --version
          google-chrome --version
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "composer.lock" }}
      - run: composer install -n --prefer-dist
      - save_cache:
          key: v1-dependencies-{{ checksum "composer.lock" }}
          paths:
            - vendor
      - restore_cache:
          keys:
            - node-v1-{{ checksum "package-lock.json" }}
      - run: npm install
      - save_cache:
          key: node-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - run:
          name: "Run JS Lint"
          command: |
            npm run lint
      - run:
          name: "Run PHP Lint"
          command: |
            composer phpcs
      - run:
          name: "Run PHP Stan"
          command: |
            composer phpstan
      - run:
          name: "Run PHPCS Fixer"
          command: |
            composer phpcsfixer
  test-php:
    docker:
      - image: cimg/php:7.4-node
      - image: cimg/mariadb:10.8
    environment:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress/
    steps:
      - checkout
      - run: sudo apt-get update
      - browser-tools/install-browser-tools:
          install-firefox: false
          chrome-version: latest
      - run: |
          php --version
          node --version
          google-chrome --version
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "composer.lock" }}
      - run: composer install -n --prefer-dist
      - save_cache:
          key: v1-dependencies-{{ checksum "composer.lock" }}
          paths:
            - vendor
      - restore_cache:
          keys:
            - node-v1-{{ checksum "package-lock.json" }}
      - run: npm install
      - save_cache:
          key: node-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - run: npm run prod
      - run:
          name: "Install Extras"
          command: |
            sudo apt-get update --allow-releaseinfo-change
            sudo apt-get install subversion
            sudo apt-get install mariadb-client
            sudo apt-get install -y libfreetype6-dev libjpeg-dev libpng-dev
            sudo docker-php-ext-configure gd --with-freetype=/usr/include/ --with-jpeg=/usr/include/
      - run:
          name: "Run Tests"
          command: |
            bash bin/install-wp-tests.sh wordpress_test root '' 127.0.0.1 latest
            composer phpunit
            WP_MULTISITE=1 composer phpunit
            rm -rf $WP_TESTS_DIR $WP_CORE_DIR
            bash bin/install-wp-tests.sh wordpress_test root '' 127.0.0.1 nightly true
            composer phpunit
    # The resource_class feature allows configuring CPU and RAM resources for each job. Different resource classes are available for different executors. https://circleci.com/docs/2.0/configuration-reference/#resourceclass
    resource_class: large
  test-php-old:
    docker:
      - image: circleci/php:7.2-node-browsers
      - image: circleci/mariadb:10.3
    environment:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress/
    steps:
      - checkout
      - run: |
          php --version
          node --version
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "composer.lock" }}
      - run: composer install -n --prefer-dist
      - save_cache:
          key: v1-dependencies-{{ checksum "composer.lock" }}
          paths:
            - vendor
      - restore_cache:
          keys:
            - node-v1-{{ checksum "package-lock.json" }}
      - run: npm install
      - save_cache:
          key: node-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - run: npm run prod
      - run:
          name: "Install Extras"
          command: |
            sudo apt-get update --allow-releaseinfo-change
            sudo apt-get install subversion
            sudo apt-get install -y libmagickwand-dev --no-install-recommends
            yes '' | sudo pecl install imagick || true
            sudo docker-php-ext-enable imagick
            sudo docker-php-ext-install mysqli
            sudo apt-get install mariadb-client-10.3
            sudo apt-get install -y libfreetype6-dev libjpeg62-turbo-dev libpng-dev
            sudo docker-php-ext-configure gd --with-freetype-dir=/usr/include/ --with-jpeg-dir=/usr/include/ && sudo docker-php-ext-install gd
      - run:
          name: "Run WordPress 4.6 Tests"
          command: |
            bash bin/install-wp-tests.sh wordpress_test root '' 127.0.0.1 4.6 true
            composer phpunit
  test-js:
    docker:
      - image: cimg/php:7.4-node
    steps:
      - checkout
      - run: sudo apt-get update
      - browser-tools/install-browser-tools:
          install-firefox: false
          chrome-version: latest
      - run: |
          php --version
          node --version
          google-chrome --version
      - restore_cache:
          keys:
            - node-v1-{{ checksum "package-lock.json" }}
      - run:
          name: "Install JavaScript Dependencies"
          command: |
            npm install
      - save_cache:
          key: node-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - run:
          name: "Run JS Tests"
          command: |
            npm run test
